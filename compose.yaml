services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flagcontrol
      POSTGRES_USER: flagcontrol
      POSTGRES_PASSWORD: flagcontrol-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - flags-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagcontrol -d flagcontrol"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  flags-data:
